<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Social Publisher</title>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.8;
      background: #f7f7f7;
      color: #222;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 { margin-bottom: 10px; }
  </style>
</head>

<body>
  <div class="box">
    <h1>AI Social Publisher</h1>

    <h2>社群內容發布工具</h2>

    <p>
      AI Social Publisher 是一套社群內容管理與發布工具，
      協助使用者管理自己的社群媒體內容。
    </p>

    <p>
      使用者可以授權自己的社群帳號，
      選擇影片等媒體內容，並透過支援的平台功能進行發布。
    </p>

    <h2>TikTok 整合</h2>

    <p>
      本應用程式使用 TikTok 官方 API，
      在取得使用者授權後，協助使用者將自己選擇的影片內容
      上傳或發布至自己的 TikTok 帳號。
    </p>

    <p>
      未經使用者授權，本應用程式不會自行發布任何內容。
    </p>

    <hr>

    <p>AI Social Publisher</p>
  </div>
</body>
</html>
